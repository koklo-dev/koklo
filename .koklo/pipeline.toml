[pipeline]
db_path = "sqlite://koklo-sessions.db"
artifacts_dir = "docs/planning_artifacts"
agents_dir = "agents/built-in"

[workflow]
# Workflow preset for this project.
# Options: sdd (default) | bmad | speckit | light | custom
preset = "sdd"

[agents.pm]
provider = "ollama"
model = "qwen2.5-coder:7b"
system_prompt = "agents/built-in/pm.md"
timeout_secs = 120

[agents.architect]
provider = "ollama"
model = "qwen2.5-coder:7b"
system_prompt = "agents/built-in/architect.md"
timeout_secs = 180

[agents.developer]
provider = "anthropic"
model = "claude-opus-4-6"
system_prompt = "agents/built-in/developer.md"
timeout_secs = 600
sandbox = "bubblewrap"

[agents.qa]
provider = "anthropic"
model = "claude-opus-4-6"
system_prompt = "agents/built-in/qa.md"
timeout_secs = 300
sandbox = "bubblewrap"

[agents.reviewer]
provider = "ollama"
model = "qwen2.5-coder:7b"
system_prompt = "agents/built-in/reviewer.md"
timeout_secs = 120
sandbox = "landlock"

# ── BMAD / Spec Kit additional agents ─────────────────────────────────────────

[agents.analyst]
provider = "ollama"
model = "qwen2.5-coder:7b"
system_prompt = "agents/built-in/analyst.md"
timeout_secs = 120

[agents.security]
provider = "ollama"
model = "qwen2.5-coder:7b"
system_prompt = "agents/built-in/security.md"
timeout_secs = 180

[agents.doc-writer]
provider = "ollama"
model = "qwen2.5-coder:7b"
system_prompt = "agents/built-in/doc-writer.md"
timeout_secs = 180

[agents.constitution-writer]
provider = "ollama"
model = "qwen2.5-coder:7b"
system_prompt = "agents/built-in/constitution-writer.md"
timeout_secs = 120

[agents.task-planner]
provider = "ollama"
model = "qwen2.5-coder:7b"
system_prompt = "agents/built-in/task-planner.md"
timeout_secs = 120

# ── Providers ──────────────────────────────────────────────────────────────────

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"

[providers.ollama]
base_url = "http://127.0.0.1:11434"

# Stub entries — activate by setting the corresponding env var.
# The registry will warn and skip any provider whose key is not set.

[providers.openai]
api_key_env = "OPENAI_API_KEY"
model = "gpt-4o"

[providers.mistral]
api_key_env = "MISTRAL_API_KEY"
model = "mistral-large-latest"

[providers.claude-code]
# No API key required — uses the `claude` CLI binary.

[providers.codex]
# No API key required — uses the `codex` CLI binary.
