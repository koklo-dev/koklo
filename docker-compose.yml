services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: koklo
      POSTGRES_PASSWORD: koklo
      POSTGRES_DB: koklo
    ports:
      - "127.0.0.1:${KOKLO_DB_PORT:-5432}:5432"
    volumes:
      - koklo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U koklo -d koklo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  koklo-postgres-data:
