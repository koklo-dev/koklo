name: Documentation improvement
description: Request docs additions or fixes
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: current
    attributes:
      label: Current state
      description: What is missing, unclear, or wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected improvement
      description: What should the docs say instead?
    validations:
      required: true
