name: Release - Infra

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.next.outputs.next_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: next
        env:
          TAG_SUFFIX: ""
        run: |
          set -euo pipefail

          if [ -z "${TAG_SUFFIX}" ]; then
            regex='^v[0-9]+\.[0-9]+\.[0-9]+$'
            latest_version="$(git tag -l 'v*' | grep -E "${regex}" | sed 's/^v//' | sort -V | tail -n 1 || true)"
          else
            regex="^v[0-9]+\.[0-9]+\.[0-9]+${TAG_SUFFIX}$"
            latest_version="$(git tag -l "v*${TAG_SUFFIX}" | grep -E "${regex}" | sed -E "s/^v([0-9]+\.[0-9]+\.[0-9]+)${TAG_SUFFIX}$/\1/" | sort -V | tail -n 1 || true)"
          fi

          if [ -z "${latest_version}" ]; then
            major=0
            minor=1
            patch=0
          else
            IFS='.' read -r major minor patch <<< "${latest_version}"
            patch=$((patch + 1))
          fi

          next_tag="v${major}.${minor}.${patch}${TAG_SUFFIX}"
          echo "next_tag=${next_tag}" >> "${GITHUB_OUTPUT}"
          echo "Next release tag: ${next_tag}" >> "${GITHUB_STEP_SUMMARY}"

  release:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'develop'
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.next.outputs.next_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: next
        env:
          TAG_SUFFIX: ""
        run: |
          set -euo pipefail

          if [ -z "${TAG_SUFFIX}" ]; then
            regex='^v[0-9]+\.[0-9]+\.[0-9]+$'
            latest_version="$(git tag -l 'v*' | grep -E "${regex}" | sed 's/^v//' | sort -V | tail -n 1 || true)"
          else
            regex="^v[0-9]+\.[0-9]+\.[0-9]+${TAG_SUFFIX}$"
            latest_version="$(git tag -l "v*${TAG_SUFFIX}" | grep -E "${regex}" | sed -E "s/^v([0-9]+\.[0-9]+\.[0-9]+)${TAG_SUFFIX}$/\1/" | sort -V | tail -n 1 || true)"
          fi

          if [ -z "${latest_version}" ]; then
            major=0
            minor=1
            patch=0
          else
            IFS='.' read -r major minor patch <<< "${latest_version}"
            patch=$((patch + 1))
          fi

          next_tag="v${major}.${minor}.${patch}${TAG_SUFFIX}"
          echo "next_tag=${next_tag}" >> "${GITHUB_OUTPUT}"

      - name: Create and push tag
        id: tag
        env:
          NEXT_TAG: ${{ steps.next.outputs.next_tag }}
        run: |
          set -euo pipefail

          git fetch --tags

          if git rev-parse "${NEXT_TAG}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/${NEXT_TAG}" | grep -q .; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "Tag ${NEXT_TAG} already exists, skipping creation." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${NEXT_TAG}"
          git push origin "${NEXT_TAG}"
          echo "exists=false" >> "${GITHUB_OUTPUT}"

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next.outputs.next_tag }}
          name: ${{ steps.next.outputs.next_tag }}
          generate_release_notes: true
