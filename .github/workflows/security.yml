# Trivy : dépendances vulnérables et secrets versionnés (vision §10.2, §22 point 8).
name: security

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.1

jobs:
  trivy:
    name: trivy (dépôt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # La fixture vulnérable est volontairement exclue : elle est jugée par le job suivant.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: .github/fixtures
          exit-code: '1'

  trivy-detects-critical:
    name: trivy (la fixture critique est détectée)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Preuve que le gate échoue : le même scan, pointé sur le lockfile vulnérable,
      # doit sortir en erreur. S'il passe, le gate est aveugle et ce job échoue.
      - id: fixture
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .github/fixtures/trivy-vulnerable
          scanners: vuln
          severity: CRITICAL
          exit-code: '1'

      - name: La fixture doit faire échouer Trivy
        env:
          OUTCOME: ${{ steps.fixture.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "Trivy n'a pas échoué sur la fixture critique (résultat : $OUTCOME)" >&2
            exit 1
          fi
