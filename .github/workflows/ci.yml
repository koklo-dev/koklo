# CI complète (vision §16.3, §19.2, §22 point 8, TK-4).
# - `ci` est le check requis : son nom est stable et il s'exécute toujours ; seules
#   ses étapes lourdes sont conditionnées à ce que `changes` détecte.
# - Sur PR, turbo n'exécute que les paquets touchés (`--affected`) ; sur push, tout.
# - Tant qu'il n'y a pas de package.json (workspace non posé), les étapes pnpm sont sautées.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Décide quels jobs sont nécessaires d'après les fichiers modifiés.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      skills: ${{ steps.detect.outputs.skills }}
      ci: ${{ steps.detect.outputs.ci }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" | bash .github/scripts/detect-changes.sh >> "$GITHUB_OUTPUT"
          else
            printf 'code=true\nskills=true\nci=true\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  ci:
    needs: changes
    runs-on: ubuntu-latest
    env:
      TURBO_ARGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Agent layer is valid
        run: jq -e '.loop.tickets == "vault"' .project/state.json

      - name: Detect workspace
        id: ws
        if: needs.changes.outputs.code == 'true'
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        uses: pnpm/action-setup@v6.1.0

      - if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        run: pnpm lint

      - name: Typecheck
        if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        run: pnpm exec turbo run typecheck $TURBO_ARGS

      # Une PR qui ne touche que des fichiers racine (scripts, biome.json, workflows…) ne
      # rattache aucun paquet à turbo : aucun test, donc aucun rapport à exiger.
      - name: Plan unit tests
        id: plan
        if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        run: pnpm exec turbo run test $TURBO_ARGS --dry=json | bash .github/scripts/tests-planned.sh >> "$GITHUB_OUTPUT"

      - name: Unit tests with coverage
        if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        run: pnpm exec turbo run test $TURBO_ARGS

      - name: Coverage thresholds
        if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        env:
          REQUIRE_REPORTS: ${{ steps.plan.outputs.planned == 'true' && '--require-reports' || '' }}
        run: bash .github/scripts/check-coverage.sh $REQUIRE_REPORTS .

      - name: Upload coverage summaries
        if: always() && needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-summaries
          path: |
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          if-no-files-found: ignore

      - name: Build
        if: needs.changes.outputs.code == 'true' && steps.ws.outputs.present == 'true'
        run: pnpm exec turbo run build $TURBO_ARGS

  # Les runtimes d'agent chargent .claude/skills/ et .codex/skills/, jamais
  # shipyard/skills/ : une source modifiée sans republication laisse les sessions
  # suivre une procédure périmée.
  skills:
    name: skills in sync
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Skill overrides match their published copies
        run: bash .github/scripts/skills-sync-gate.sh

  # Auto-tests des scripts de la CI (détection des changements, gate de couverture).
  ci-scripts:
    name: ci scripts
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Self-tests
        run: |
          for t in .github/scripts/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
