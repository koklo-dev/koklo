name: CI - Community

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  boundary-check:
    name: Boundary Check (Open Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check open/ee boundary
        run: bash scripts/check-boundary.sh

  rust-checks:
    name: Rust - Build & Test
    needs: boundary-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Happy-path E2E (mock LLM)
        # Explicit P1 §4 gate. The deterministic, model-free end-to-end test
        # (apps/cli/tests/happy_path.rs) is already covered by the workspace
        # run above; it is pinned here as a named gate so a happy-path
        # regression is obvious in the CI summary. See CONTRIBUTING.md.
        run: cargo test -p koklo-cli --test happy_path
        env:
          RUST_BACKTRACE: 1

  frontend-checks:
    name: Frontend - Desktop scaffold compile (P1 minimal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Frontend quality gating is intentionally MINIMAL at P1 and deferred to P2.
      #
      # The workspace-wide `pnpm run lint` / `typecheck` / `build` scripts used to
      # run here, but @koklo/ui, @koklo/constellation and @koklo/trpc-client (and
      # the desktop `lint`) only expose echo-stub scripts (`echo linting @koklo/...`).
      # Running them produced a misleading green that implied frontend quality was
      # verified when nothing was actually checked. Those fake-green steps are
      # removed (sprint-005 US-011).
      #
      # The only genuine frontend signal available at P1 is that the desktop
      # scaffold type-checks (`tsc --noEmit`) and builds (`vite build`), so we run
      # exactly that — scoped to @koklo/desktop — and nothing more. Real ESLint,
      # cross-package typecheck and unit/a11y tests are P2 scope; re-enable full
      # gating when the frontend is built for real (see sprints/backlog).
      - name: Desktop scaffold typecheck (tsc --noEmit)
        run: pnpm --filter @koklo/desktop run typecheck
      - name: Desktop scaffold build (vite build)
        run: pnpm --filter @koklo/desktop run build

  dependency-audit:
    name: Dependency Audit (Rust + pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high/critical block)
        run: bash scripts/audit.sh

  coverage:
    name: Coverage (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Report-only until the coverage baseline reaches the spec §2 threshold (80%).
      # Flip to blocking by removing KOKLO_COVERAGE_LINE_MIN once the debt is cleared
      # (backlog follow-up). Locally, `bash scripts/coverage.sh` enforces 80% by default.
      - name: Measure coverage
        run: KOKLO_COVERAGE_LINE_MIN=0 bash scripts/coverage.sh
