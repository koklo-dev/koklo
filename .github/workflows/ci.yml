# CI complète (vision §16.3, §19.2, §22 point 8, TK-4).
# - `ci` est le check requis : son nom est stable et il s'exécute toujours. C'est un job final
#   léger qui agrège tous les autres (il ne fait rien de lourd lui-même) : les vérifications
#   (`checks`), les tests unitaires en parallèle (`tests`), la couverture, e2e, a11y, images…
#   tournent chacune de leur côté dès que `changes` a répondu, sans s'attendre entre elles.
# - Sur PR, turbo n'exécute que les paquets touchés (`--affected`) ; sur push, tout.
# - Tant qu'il n'y a pas de package.json (workspace non posé), les jobs pnpm sont sautés.
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Décide quels jobs sont nécessaires d'après les fichiers modifiés.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.detect.outputs.code }}
      skills: ${{ steps.detect.outputs.skills }}
      ci: ${{ steps.detect.outputs.ci }}
      deploy: ${{ steps.detect.outputs.deploy }}
      workspace: ${{ steps.detect.outputs.workspace }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "origin/${BASE_REF}...HEAD" | bash .github/scripts/detect-changes.sh >> "$GITHUB_OUTPUT"
          else
            printf 'code=true\nskills=true\nci=true\ndeploy=true\n' >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then echo "workspace=true" >> "$GITHUB_OUTPUT"; else echo "workspace=false" >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"

  # Lint, typecheck et build : rapides (~1 min), indépendants des tests et des jobs lourds.
  checks:
    name: lint, typecheck, build
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    env:
      TURBO_ARGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec turbo run typecheck $TURBO_ARGS

      - name: Build
        run: pnpm exec turbo run build $TURBO_ARGS

  # Tests unitaires et d'intégration, découpés en lots parallèles (avant : un seul job de ~38 min).
  # - `@koklo/api` (le plus gros) est lui-même découpé en 3 shards Vitest (`--shard=i/3`). Un shard ne
  #   couvre qu'une partie du code : il publie un rapport `blob` (résultats + couverture brute) et ses
  #   seuils Vitest sont neutralisés ; le job `api-coverage` fusionne les 3 blobs (`--merge-reports`)
  #   et applique là les seuils de l'API sur l'ensemble.
  # - Les lots sont disjoints et leur réunion couvre tous les paquets : `other` prend « tout le reste »
  #   (--except), donc un nouveau paquet tombe dans un lot sans toucher au workflow.
  # - Les suites d'intégration (`db: true`) partagent UN Postgres 17 démarré une fois par job, via
  #   TEST_DATABASE_URL, au lieu d'un `docker run` par fichier de test. Chaque fichier garde sa
  #   propre base (créée puis supprimée par createTestDatabase). Réglages de CI : fsync coupé,
  #   datadir en tmpfs, plus de connexions que le défaut (plusieurs workers ouvrent des pools).
  # - Sur PR, `--affected` détermine les paquets à tester ; tests-planned.sh en garde ceux du lot.
  tests:
    name: tests (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.workspace == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api-1
            db: true
            select: --only @koklo/api
            shard: 1/3
          - name: api-2
            db: true
            select: --only @koklo/api
            shard: 2/3
          - name: api-3
            db: true
            select: --only @koklo/api
            shard: 3/3
          - name: web
            db: false
            select: --only @koklo/web
          - name: worker-db
            db: true
            select: --only @koklo/worker,@koklo/db
          - name: other
            db: false
            select: --except @koklo/api,@koklo/web,@koklo/worker,@koklo/db
    env:
      TURBO_ARGS: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Start Postgres
        if: matrix.db
        run: |
          docker run -d --name koklo-test-pg --tmpfs /var/lib/postgresql/data:rw \
            -p 127.0.0.1:5432:5432 -e POSTGRES_PASSWORD=koklo-test \
            postgres:17-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_connections=500
          for i in $(seq 1 60); do
            docker exec koklo-test-pg pg_isready -U postgres && exit 0
            sleep 1
          done
          docker logs koklo-test-pg
          exit 1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Une PR qui ne touche que des fichiers racine (scripts, biome.json, workflows…) ne
      # rattache aucun paquet à turbo : aucun test, donc aucun rapport à exiger.
      - name: Plan unit tests
        id: plan
        run: pnpm exec turbo run test $TURBO_ARGS --dry=json | bash .github/scripts/tests-planned.sh ${{ matrix.select }} >> "$GITHUB_OUTPUT"

      - name: Unit tests with coverage
        if: steps.plan.outputs.planned == 'true'
        env:
          FILTERS: ${{ steps.plan.outputs.filters }}
          TEST_DATABASE_URL: ${{ matrix.db && 'postgresql://postgres:koklo-test@127.0.0.1:5432/postgres' || '' }}
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            # Seuils neutralisés : ce shard ne voit qu'une partie du code (jugés après fusion).
            pnpm exec turbo run test $FILTERS -- --shard=${{ matrix.shard }} --reporter=default --reporter=blob \
              --coverage.thresholds.lines=0 --coverage.thresholds.branches=0
          else
            pnpm exec turbo run test $FILTERS
          fi

      # Les seuils de couverture sont agrégés sur tous les paquets : ils ne peuvent pas être
      # jugés lot par lot. Chaque lot publie ses rapports et la liste de ses paquets ; le job
      # `coverage` les réunit.
      - name: Pack coverage summaries
        if: always() && steps.plan.outputs.planned == 'true' && !matrix.shard
        env:
          PACKAGES: ${{ steps.plan.outputs.packages }}
        run: |
          mkdir -p shard
          printf '%s\n' "$PACKAGES" > "shard/${{ matrix.name }}.packages"
          find apps packages -path '*/coverage/coverage-summary.json' -not -path '*/node_modules/*' > shard/files.txt
          if [ -s shard/files.txt ]; then
            tar czf "shard/${{ matrix.name }}.tgz" --files-from=shard/files.txt
          fi
          rm shard/files.txt

      - name: Upload coverage shard
        if: always() && steps.plan.outputs.planned == 'true' && !matrix.shard
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-shard-${{ matrix.name }}
          path: shard/
          if-no-files-found: ignore

      - name: Upload API blob
        if: always() && steps.plan.outputs.planned == 'true' && matrix.shard
        uses: actions/upload-artifact@v7.0.2
        with:
          name: api-blob-${{ matrix.name }}
          path: apps/api/.vitest/blob/
          include-hidden-files: true
          if-no-files-found: error

  # Fusion des 3 shards de l'API : un seul rapport de couverture pour `@koklo/api`, seuils Vitest appliqués
  # sur l'ensemble. Rien à faire (et pas d'install) si l'API n'a pas été testée (pas de blob).
  api-coverage:
    needs: [changes, tests]
    if: needs.tests.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Aucun blob (API non touchée) : le téléchargement ne trouve rien, ce n'est pas une erreur.
      - uses: actions/download-artifact@v8.0.2
        id: blobs
        continue-on-error: true
        with:
          pattern: api-blob-*
          path: apps/api/.vitest/blob
          merge-multiple: true

      - name: Blobs present
        id: present
        run: |
          if ls apps/api/.vitest/blob/blob-*.json >/dev/null 2>&1; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - if: steps.present.outputs.present == 'true'
        uses: pnpm/action-setup@v6.1.1

      - if: steps.present.outputs.present == 'true'
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.present.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Il faut les 3 blobs : un shard manquant fausserait la couverture sans faire échouer la fusion.
      - name: Merge API coverage
        if: steps.present.outputs.present == 'true'
        run: |
          test "$(ls apps/api/.vitest/blob/blob-*.json | wc -l)" -eq 3
          pnpm --filter @koklo/api exec vitest --merge-reports --coverage
          mkdir -p shard
          echo "apps/api" > shard/api.packages
          tar czf shard/api.tgz apps/api/coverage/coverage-summary.json

      - name: Upload coverage shard
        if: steps.present.outputs.present == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-shard-api
          path: shard/

  # Seuils de couverture sur la réunion des lots (agrégats lignes/branches, seuils stricts domain/delivery).
  coverage:
    needs: [changes, tests, api-coverage]
    if: needs.tests.result == 'success' && needs.api-coverage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: coverage-shard-*
          path: shard
          merge-multiple: true

      - name: Merge coverage summaries
        run: |
          shopt -s nullglob
          for archive in shard/*.tgz; do tar xzf "$archive"; done

      - name: Coverage thresholds
        run: |
          PACKAGES="$(cat shard/*.packages 2>/dev/null | tr '\n' ',' | sed -e 's/,\{2,\}/,/g' -e 's/^,//' -e 's/,$//')"
          if [ -n "$PACKAGES" ]; then
            bash .github/scripts/check-coverage.sh --require-reports --expect "$PACKAGES" .
          else
            bash .github/scripts/check-coverage.sh .
          fi

      - name: Upload coverage summaries
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-summaries
          path: |
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/coverage-summary.json
          if-no-files-found: ignore

  # Check requis de `develop` : nom stable, toujours exécuté, léger. Il ne fait que juger le résultat
  # des autres jobs.
  ci:
    needs: [changes, checks, tests, api-coverage, coverage, e2e, a11y-web, images, deploy-check]
    # always() : si `changes` échoue, `ci` doit s'exécuter et échouer, pas être sauté —
    # un check requis sauté compte comme réussi.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Change detection succeeded
        if: needs.changes.result != 'success'
        run: |
          echo "::error::job 'changes' ended with '${{ needs.changes.result }}'"
          exit 1

      # `ci` est la seule vérification requise : sans ces gardes, un job rouge ne bloque pas le
      # merge. `skipped` reste accepté partout (jobs sans objet quand `changes` ne les déclenche pas) ;
      # un job `tests` en échec saute `coverage`, d'où le garde séparé sur chacun.
      - name: Checks did not fail
        if: needs.checks.result == 'failure' || needs.checks.result == 'cancelled'
        run: |
          echo "::error::job 'checks' ended with '${{ needs.checks.result }}'"
          exit 1

      - name: Tests did not fail
        if: needs.tests.result == 'failure' || needs.tests.result == 'cancelled'
        run: |
          echo "::error::job 'tests' ended with '${{ needs.tests.result }}'"
          exit 1

      - name: API coverage merge did not fail
        if: needs.api-coverage.result == 'failure' || needs.api-coverage.result == 'cancelled'
        run: |
          echo "::error::job 'api-coverage' ended with '${{ needs.api-coverage.result }}'"
          exit 1

      - name: Coverage did not fail
        if: needs.coverage.result == 'failure' || needs.coverage.result == 'cancelled'
        run: |
          echo "::error::job 'coverage' ended with '${{ needs.coverage.result }}'"
          exit 1

      # Même logique : un e2e rouge ne doit pas passer. `skipped` reste accepté (e2e n'a pas lieu quand code=false).
      - name: E2E did not fail
        if: needs.e2e.result == 'failure' || needs.e2e.result == 'cancelled'
        run: |
          echo "::error::job 'e2e' ended with '${{ needs.e2e.result }}'"
          exit 1

      # Même logique : un écran qui viole WCAG 2.2 AA (axe) ne doit pas passer.
      - name: Accessibility did not fail
        if: needs.a11y-web.result == 'failure' || needs.a11y-web.result == 'cancelled'
        run: |
          echo "::error::job 'a11y-web' ended with '${{ needs.a11y-web.result }}'"
          exit 1

      # Même logique : `ci` doit refuser une image qui ne se construit pas.
      - name: Images did not fail
        if: needs.images.result == 'failure' || needs.images.result == 'cancelled'
        run: |
          echo "::error::job 'images' ended with '${{ needs.images.result }}'"
          exit 1

      # Même logique : un manifest invalide ne doit pas passer. `skipped` reste accepté (.deploy/ intact).
      - name: Deploy check did not fail
        if: needs.deploy-check.result == 'failure' || needs.deploy-check.result == 'cancelled'
        run: |
          echo "::error::job 'deploy-check' ended with '${{ needs.deploy-check.result }}'"
          exit 1

      - uses: actions/checkout@v7.0.1

      - name: Agent layer is valid
        run: jq -e '.loop.tickets == "vault"' .project/state.json

  # Parcours sur le vrai stack (Postgres seedé + API + web), vision §16.3 / §19.1 (TK-15).
  # `pnpm e2e` gère Compose, migrate, seed, build et les serveurs ; secrets d'e2e factices,
  # définis dans e2e/scripts/run.ts.
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @koklo/e2e exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  # Accessibilité des écrans de apps/web (TK-142) : axe WCAG 2.2 AA sur les états de a11y.spec.ts et
  # sur la galerie /dev/ui, contre le faux API de e2e/support (ni base ni secret). Un worker : le faux
  # API est partagé. Une relance par test absorbe une animation interrompue.
  a11y-web:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build web dependencies
        run: pnpm exec turbo run build --filter=@koklo/web^...

      - name: Install Playwright browser
        run: pnpm --filter @koklo/web exec playwright install --with-deps chromium

      - name: Accessibility (axe)
        run: pnpm --filter @koklo/web exec playwright test e2e/a11y.spec.ts e2e/dev-ui.spec.ts --retries=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: a11y-web-report
          path: apps/web/test-results/
          if-no-files-found: ignore

  # Construction des 3 images (TK-16, vision §20.4) : contexte = racine, sans --build-arg,
  # sans publication (le push GHCR relève de TK-18).
  images:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build web
        run: docker build -f apps/web/Dockerfile -t koklo-web:ci .

      - name: Build api
        run: docker build -f apps/api/Dockerfile -t koklo-api:ci .

      - name: Build worker
        run: docker build -f apps/worker/Dockerfile -t koklo-worker:ci .

      # Démarre les images contre un Postgres jetable : migrations, /health, /api/health, non-root.
      - name: Image tests
        run: bash .github/scripts/docker-images.test.sh

  # Valide .deploy/manifest.yaml avec le validateur du repo infra (TK-17, vision §20.4).
  # Infra est public : checkout sans token ni secret, épinglé sur un SHA complet (mise à jour volontaire).
  deploy-check:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    env:
      INFRA_DIR: ${{ github.workspace }}/infra
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          repository: josias-koffi/infra
          ref: 834d82912f5ee5d56a174163a01b0b140438d5f4
          path: infra

      - name: Install validator dependencies
        run: pip install jsonschema==4.26.0 PyYAML==6.0.3

      - name: Validate manifest
        run: bash scripts/deploy-check.sh

  # Les runtimes d'agent chargent .claude/skills/ et .codex/skills/, jamais
  # shipyard/skills/ : une source modifiée sans republication laisse les sessions
  # suivre une procédure périmée.
  skills:
    name: skills in sync
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Skill overrides match their published copies
        run: bash .github/scripts/skills-sync-gate.sh

  # Auto-tests des scripts de la CI (détection des changements, gate de couverture).
  ci-scripts:
    name: ci scripts
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Self-tests
        run: |
          for t in .github/scripts/*.test.sh; do
            echo "== $t"
            bash "$t"
          done
