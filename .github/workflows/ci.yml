name: CI - Community

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  boundary-check:
    name: Boundary Check (Open Core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check open/ee boundary
        run: bash scripts/check-boundary.sh

  rust-checks:
    name: Rust - Build & Test
    needs: boundary-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace

  frontend-checks:
    name: TypeScript - Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  dependency-audit:
    name: Dependency Audit (Rust + pnpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies (high/critical block)
        run: bash scripts/audit.sh

  coverage:
    name: Coverage (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Report-only until the coverage baseline reaches the spec §2 threshold (80%).
      # Flip to blocking by removing KOKLO_COVERAGE_LINE_MIN once the debt is cleared
      # (backlog follow-up). Locally, `bash scripts/coverage.sh` enforces 80% by default.
      - name: Measure coverage
        run: KOKLO_COVERAGE_LINE_MIN=0 bash scripts/coverage.sh
