[package]
name = "koklo-desktop"
version = "0.1.0"
edition = "2021"
description = "Koklo desktop application shell"
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
dirs = { workspace = true }
tauri = { version = "=2.11.2", features = [] }
koklo-core = { path = "../../../crates/core" }
koklo-storage = { path = "../../../crates/storage" }
koklo-events = { path = "../../../crates/events" }
koklo-providers = { path = "../../../crates/providers" }
koklo-workflow-engine = { path = "../../../crates/workflow-engine" }

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dev-dependencies]
tempfile = "3"
