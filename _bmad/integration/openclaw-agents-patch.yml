# OpenClaw patch for BMAD v6 command IDs in koklo
agents:
  - id: pm
    type: bmad
    bmad_command: "/bmad-agent-bmm-pm"
    customize: "_bmad/_config/agents/bmm-pm.customize.yaml"

  - id: analyst
    type: bmad
    bmad_command: "/bmad-agent-bmm-analyst"
    customize: "_bmad/_config/agents/bmm-analyst.customize.yaml"

  - id: architect
    type: bmad
    bmad_command: "/bmad-agent-bmm-architect"
    customize: "_bmad/_config/agents/bmm-architect.customize.yaml"

  - id: developer
    type: bmad
    bmad_command: "/bmad-agent-bmm-dev"
    customize: "_bmad/_config/agents/bmm-dev.customize.yaml"

  - id: qa
    type: bmad
    bmad_command: "/bmad-agent-bmm-qa"
    customize: "_bmad/_config/agents/bmm-qa.customize.yaml"

  - id: sm
    type: bmad
    bmad_command: "/bmad-agent-bmm-sm"
    customize: "_bmad/_config/agents/bmm-sm.customize.yaml"

  - id: scribe
    type: bmad
    bmad_command: "/bmad-agent-bmm-tech-writer"
    customize: "_bmad/_config/agents/bmm-tech-writer.customize.yaml"
